<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schnitt-Labor · DT-ProfiSchraube</title>
<!-- ==========================================================================
  WEGWERF-HÜLLE der Laborphase (Masterplan 5.2). Übernommen wird NUR schnitt.js.
  Design-Tokens unten sind 1:1 aus style.css kopiert (dunkel + hell), damit die
  Zeichnung exakt so aussieht wie später in der App. Beide Dateien (diese HTML
  und schnitt.js) in DENSELBEN Ordner legen, dann diese Datei öffnen.
=========================================================================== -->
<style>
/* ---- Design-Tokens 1:1 aus style.css (App) ---- */
:root{
  --bg:#13171c; --bg2:#1a2026; --surface:#212a31; --surface2:#27313a;
  --line:#323e49; --line-soft:#2a333c; --fg:#e7eef4; --muted:#94a4b2; --faint:#6c7b88;
  --accent:#34c3d4; --accent-strong:#1f97a8; --accent-soft:rgba(52,195,212,.14);
  --brass:#caa04a; --brass-soft:rgba(202,160,74,.16);
  --ok:#46b95c; --warn:#d6a328; --bad:#e5675c;
  --ok-soft:rgba(70,185,92,.14); --warn-soft:rgba(214,163,40,.14); --bad-soft:rgba(229,103,92,.14);
  --radius:12px; --radius-sm:8px;
  --shadow:0 14px 34px -18px rgba(0,0,0,.7);
  --font-ui:system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-num:ui-monospace,"Cascadia Mono","Segoe UI Mono",Consolas,"Roboto Mono",monospace;
  --font-math:"Cambria Math","Times New Roman",Georgia,serif;
}
[data-theme="light"]{
  --bg:#eef1f5; --bg2:#e5eaf0; --surface:#ffffff; --surface2:#f3f6f9;
  --line:#d3dce4; --line-soft:#e2e8ee; --fg:#182530; --muted:#566673; --faint:#8494a1;
  --accent-soft:rgba(31,151,168,.12); --brass-soft:rgba(160,120,30,.14);
  --shadow:0 12px 30px -20px rgba(20,40,60,.45);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--font-ui); color:var(--fg);
  background:
    radial-gradient(1200px 600px at 80% -10%, rgba(52,195,212,.06), transparent 60%),
    linear-gradient(180deg, var(--bg2), var(--bg));
  background-attachment:fixed; min-height:100vh; font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}

/* ---- Legende-Klassen 1:1 aus style.css (werden von schnitt.js genutzt) ---- */
.sb-vals{margin-top:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:7px 18px}
.sb-val-item{display:flex;align-items:baseline;gap:8px;min-width:0}
.sb-chip{width:11px;height:11px;border-radius:3px;flex:none;transform:translateY(1px)}
.sb-c-fg{background:var(--fg)} .sb-c-warn{background:var(--warn)} .sb-c-faint{background:var(--faint)}
.sb-c-accent{background:var(--accent)} .sb-c-brass{background:var(--brass)}
.sb-c-mix{background:linear-gradient(90deg,var(--accent),var(--brass))}
.sb-vsym{font-family:var(--font-num);font-weight:700;font-size:13.5px;color:var(--fg);min-width:58px}
.sb-vname{color:var(--muted);font-size:12.5px;flex:1 1 auto;min-width:0}
.sb-vnum{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-weight:600;font-size:13.5px;color:var(--fg);margin-left:auto;white-space:nowrap}

/* ---- Labor-Layout (nur Hülle, wird nicht übernommen) ---- */
.hdr{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px 6px}
.mark{font-weight:800;font-size:16px;letter-spacing:-.02em;white-space:nowrap;
  background:linear-gradient(135deg,var(--accent),var(--brass));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.badge{font-size:10.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;
  color:var(--brass);background:var(--brass-soft);border:1px solid var(--brass);
  border-radius:999px;padding:2px 8px}
.hdr .sp{flex:1 1 auto}
.btn{background:var(--surface2);border:1px solid var(--line);color:var(--fg);
  border-radius:var(--radius-sm);padding:7px 11px;font-size:12.5px;font-family:var(--font-ui);
  cursor:pointer;line-height:1.2}
.btn:active{transform:translateY(1px)}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent-strong);color:var(--accent)}
.btn.mini{padding:4px 9px;font-size:12px}
.seg{display:flex;gap:6px;flex-wrap:wrap}

.stage{position:sticky;top:0;z-index:30;padding:8px 12px 8px;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.stage svg{max-height:36vh}
.stage .sb-vals{grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:3px 12px;margin-top:6px}
.stage .sb-vsym{min-width:34px;font-size:12.5px}
.stage .sb-vname{font-size:11px}
.stage .sb-vnum{font-size:12.5px}

main{max-width:720px;margin:0 auto;padding:2px 0 40px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:12px 14px;margin:12px}
.card h2{font-size:11.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;
  color:var(--muted);margin:0 0 10px}
.wrap{display:flex;gap:8px;flex-wrap:wrap}
.opts{display:flex;gap:6px 18px;flex-wrap:wrap;margin-top:10px}
.opts label{display:flex;align-items:center;gap:7px;font-size:13px;cursor:pointer}
input[type="checkbox"]{accent-color:var(--accent);width:16px;height:16px}
input[type="range"]{width:100%;accent-color:var(--accent);margin:2px 0 0}
input[type="range"]:disabled{opacity:.45}
.prow{padding:8px 0;border-bottom:1px solid var(--line-soft)}
.prow:last-child{border-bottom:none}
.phead{display:flex;align-items:baseline;gap:10px}
.phead .sym{font-family:var(--font-num);font-weight:700;font-size:13.5px;min-width:34px}
.phead .auto{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);
  cursor:pointer;margin-right:auto}
.phead .val{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-size:13px;
  color:var(--fg);white-space:nowrap}
.err{background:var(--warn-soft);border:1px solid var(--warn);color:var(--fg);
  border-radius:var(--radius-sm);padding:10px 12px;font-size:13.5px}
.foot{color:var(--faint);font-size:11.5px;text-align:center;padding:0 16px 26px}
</style>
</head>
<body>

<div class="hdr">
  <span class="mark">DT-ProfiSchraube</span>
  <span class="badge">Schnitt-Labor</span>
  <span class="sp"></span>
  <div class="seg" id="langSeg">
    <button class="btn mini" data-lang="de" aria-pressed="true">DE</button>
    <button class="btn mini" data-lang="en" aria-pressed="false">EN</button>
    <button class="btn mini" data-lang="pt" aria-pressed="false">PT</button>
  </div>
  <button class="btn mini" id="themeBtn">Hell</button>
</div>

<div class="stage"><div id="stageBody"></div></div>

<main>
  <section class="card">
    <h2>Presets</h2>
    <div class="wrap" id="presetWrap"></div>
  </section>

  <section class="card">
    <h2>Typ &amp; Optionen</h2>
    <div class="seg">
      <button class="btn" id="jDSV" aria-pressed="true">DSV · Durchsteck</button>
      <button class="btn" id="jESV" aria-pressed="false">ESV · Sackloch</button>
    </div>
    <div class="opts">
      <label><input type="checkbox" id="optCone" checked> Verformungskegel (gestrichelt)</label>
      <label><input type="checkbox" id="optSplit" checked> Trennfuge bei l_K/2</label>
      <label><input type="checkbox" id="optBreak" checked> Bruchlinie (auto bei l_K/d&nbsp;&gt;&nbsp;6)</label>
    </div>
  </section>

  <section class="card">
    <h2>Geometrie</h2>

    <div class="prow">
      <div class="phead"><span class="sym">d</span>
        <span class="auto" style="margin-right:auto"></span>
        <span class="val" id="vD"></span></div>
      <input type="range" id="rD" min="3" max="39" step="0.5">
    </div>

    <div class="prow">
      <div class="phead"><span class="sym">P</span>
        <label class="auto"><input type="checkbox" id="cP" checked> automatisch (DIN&nbsp;13)</label>
        <span class="val" id="vP"></span></div>
      <input type="range" id="rP" min="0.5" max="4.5" step="0.05">
    </div>

    <div class="prow">
      <div class="phead"><span class="sym">l_K</span>
        <span class="auto" style="margin-right:auto"></span>
        <span class="val" id="vLk"></span></div>
      <input type="range" id="rLk" min="5" max="200" step="1">
    </div>

    <div class="prow">
      <div class="phead"><span class="sym">d_h</span>
        <label class="auto"><input type="checkbox" id="cDh" checked> automatisch (mittel)</label>
        <span class="val" id="vDh"></span></div>
      <input type="range" id="rDh" min="3" max="45" step="0.1">
    </div>

    <div class="prow">
      <div class="phead"><span class="sym">d_w</span>
        <label class="auto"><input type="checkbox" id="cDw" checked> automatisch (Norm)</label>
        <span class="val" id="vDw"></span></div>
      <input type="range" id="rDw" min="4" max="60" step="0.1">
    </div>

    <div class="prow">
      <div class="phead"><span class="sym">D_A</span>
        <span class="auto" style="margin-right:auto"></span>
        <span class="val" id="vDa"></span></div>
      <input type="range" id="rDa" min="6" max="140" step="0.5">
    </div>

    <div class="prow">
      <div class="phead"><span class="sym">φ</span>
        <label class="auto"><input type="checkbox" id="cPhi" checked> automatisch (VDI-Näherung)</label>
        <span class="val" id="vPhi"></span></div>
      <input type="range" id="rPhi" min="5" max="35" step="0.1">
    </div>
  </section>
</main>

<div class="foot">Wegwerf-Hülle der Laborphase — übernommen wird nur schnitt.js.<br>
Beide Dateien in einen Ordner legen und diese Seite öffnen.</div>

<script src="schnitt.js"></script>
<script>
'use strict';
/* ---- Normnahe Vorbelegungstabellen (nur Labor; App nutzt daten.js) ---- */
var PT={3:0.5,4:0.7,5:0.8,6:1,8:1.25,10:1.5,12:1.75,14:2,16:2,18:2.5,20:2.5,22:2.5,24:3,27:3,30:3.5,33:3.5,36:4,39:4};
var DH={3:3.4,4:4.5,5:5.5,6:6.6,8:9,10:11,12:13.5,14:15.5,16:17.5,18:20,20:22,22:24,24:26,27:30,30:33,33:36,36:39,39:42};
var DW={3:4.6,4:5.9,5:6.9,6:8.9,8:11.6,10:14.6,12:16.6,14:19.6,16:22.5,18:24.9,20:28.2,22:31.4,24:33.6,27:38,30:42.8,33:46.6,36:51.1,39:55.9};
function pAuto(d){return PT[d]!=null?PT[d]:Math.round(0.13*d*20)/20;}
function dhAuto(d){return DH[d]!=null?DH[d]:Math.round(d*1.1*10)/10;}
function dwAuto(d){return DW[d]!=null?DW[d]:Math.round(1.4*d*10)/10;}

/* VDI-Näherung Kegelwinkel (nur Labor-Vorbelegung; in der App liefert die Engine tanphi) */
var TANPHI_MIN=0.05, TANPHI_MAX=0.70;
function tanphiAuto(g){
  var bL=g.l_K/g.d_w, y=g.D_A/g.d_w, t;
  t=(g.joint==='DSV')
    ? 0.362+0.032*Math.log(bL/2)+0.153*Math.log(y)
    : 0.348+0.013*Math.log(bL)+0.193*Math.log(y);
  if(!isFinite(t)) t=TANPHI_MIN;
  return Math.min(TANPHI_MAX,Math.max(TANPHI_MIN,t));
}

/* ---- Presets (dh/dw/P ergeben sich aus den Auto-Tabellen) ---- */
var PRESETS=[
  {n:'M12×60 · DSV (Anhalt)', j:'DSV', d:12, lK:60, DA:40},
  {n:'M8×20 · DSV kompakt',   j:'DSV', d:8,  lK:20, DA:25},
  {n:'M16 · ESV Sackloch',    j:'ESV', d:16, lK:30, DA:50},
  {n:'M10×90 · lang (Bruch)', j:'DSV', d:10, lK:90, DA:30},
  {n:'M20 · Flansch DSV',     j:'DSV', d:20, lK:45, DA:58},
  {n:'M12 · Hülse (D_A klein)',j:'DSV', d:12, lK:40, DA:19}
];

/* ---- Zustand ---- */
var st={ joint:'DSV', d:12, P:1.75, lK:60, dh:13.5, dw:16.6, DA:40, phiDeg:20,
  autoP:true, autoDh:true, autoDw:true, autoPhi:true,
  showCone:true, showSplit:true, breakLong:true, lang:'de', theme:'dark' };

function fmt(x,dec){
  if(x==null||!isFinite(x)) return '–';
  var s=Number(x).toFixed(dec==null?0:dec);
  return (st.lang==='en')? s : s.replace('.',',');
}
function $(id){return document.getElementById(id);}
var stageBody=$('stageBody');

function geoNow(){
  var d=st.d;
  var g={ d:d,
    P:  st.autoP ? pAuto(d) : st.P,
    l_K:st.lK,
    d_h:st.autoDh? dhAuto(d): st.dh,
    d_w:st.autoDw? dwAuto(d): st.dw,
    D_A:st.DA, joint:st.joint };
  g.tanphi = st.autoPhi ? tanphiAuto(g) : Math.tan(st.phiDeg*Math.PI/180);
  return g;
}

function sync(g){
  $('rD').value=st.d;   $('vD').textContent=fmt(st.d,1)+'\u00A0mm';
  $('rP').value=g.P;    $('vP').textContent=fmt(g.P,2)+'\u00A0mm';   $('rP').disabled=st.autoP;
  $('rLk').value=st.lK; $('vLk').textContent=fmt(st.lK,0)+'\u00A0mm';
  $('rDh').value=g.d_h; $('vDh').textContent=fmt(g.d_h,1)+'\u00A0mm'; $('rDh').disabled=st.autoDh;
  $('rDw').value=g.d_w; $('vDw').textContent=fmt(g.d_w,1)+'\u00A0mm'; $('rDw').disabled=st.autoDw;
  $('rDa').value=st.DA; $('vDa').textContent=fmt(st.DA,1)+'\u00A0mm';
  var deg=Math.atan(g.tanphi)*180/Math.PI;
  $('rPhi').value=deg;  $('vPhi').textContent=fmt(deg,1)+'°';         $('rPhi').disabled=st.autoPhi;
  $('cP').checked=st.autoP; $('cDh').checked=st.autoDh; $('cDw').checked=st.autoDw; $('cPhi').checked=st.autoPhi;
  $('jDSV').setAttribute('aria-pressed', st.joint==='DSV');
  $('jESV').setAttribute('aria-pressed', st.joint==='ESV');
  $('optCone').checked=st.showCone; $('optSplit').checked=st.showSplit; $('optBreak').checked=st.breakLong;
  var lb=document.querySelectorAll('#langSeg [data-lang]');
  for(var i=0;i<lb.length;i++) lb[i].setAttribute('aria-pressed', lb[i].getAttribute('data-lang')===st.lang);
  $('themeBtn').textContent = (st.theme==='dark') ? 'Hell' : 'Dunkel';
}

function render(){
  var g=geoNow();
  if(st.autoP)  st.P=g.P;
  if(st.autoDh) st.dh=g.d_h;
  if(st.autoDw) st.dw=g.d_w;
  if(st.autoPhi)st.phiDeg=Math.atan(g.tanphi)*180/Math.PI;
  if(!window.DTSSchnitt){
    stageBody.innerHTML='<div class="err">schnitt.js nicht gefunden. Bitte beide Dateien '+
      '(Schnitt_Labor.html und schnitt.js) in denselben Ordner legen und neu laden.</div>';
    return;
  }
  stageBody.innerHTML=DTSSchnitt.build(g,{
    lang:st.lang, fmt:fmt,
    showCone:st.showCone, showSplit:st.showSplit, breakLong:st.breakLong });
  DTSSchnitt.refresh(stageBody);
  sync(g);
}

/* ---- Verkabelung ---- */
(function(){
  var pw=$('presetWrap');
  PRESETS.forEach(function(p){
    var b=document.createElement('button');
    b.className='btn'; b.textContent=p.n;
    b.addEventListener('click',function(){
      st.joint=p.j; st.d=p.d; st.lK=p.lK; st.DA=p.DA;
      st.autoP=st.autoDh=st.autoDw=st.autoPhi=true;
      render();
    });
    pw.appendChild(b);
  });

  function onR(id,fn){ $(id).addEventListener('input',function(){ fn(+this.value); render(); }); }
  onR('rD', function(v){ st.d=v; });
  onR('rP', function(v){ st.P=v; });
  onR('rLk',function(v){ st.lK=v; });
  onR('rDh',function(v){ st.dh=v; });
  onR('rDw',function(v){ st.dw=v; });
  onR('rDa',function(v){ st.DA=v; });
  onR('rPhi',function(v){ st.phiDeg=v; });

  function onC(id,fn){ $(id).addEventListener('change',function(){ fn(this.checked); render(); }); }
  onC('cP',  function(c){ st.autoP=c; });
  onC('cDh', function(c){ st.autoDh=c; });
  onC('cDw', function(c){ st.autoDw=c; });
  onC('cPhi',function(c){ st.autoPhi=c; });
  onC('optCone', function(c){ st.showCone=c; });
  onC('optSplit',function(c){ st.showSplit=c; });
  onC('optBreak',function(c){ st.breakLong=c; });

  $('jDSV').addEventListener('click',function(){ st.joint='DSV'; render(); });
  $('jESV').addEventListener('click',function(){ st.joint='ESV'; render(); });

  var lb=document.querySelectorAll('#langSeg [data-lang]');
  for(var i=0;i<lb.length;i++)(function(btn){
    btn.addEventListener('click',function(){ st.lang=btn.getAttribute('data-lang'); render(); });
  })(lb[i]);

  $('themeBtn').addEventListener('click',function(){
    st.theme=(st.theme==='dark')?'light':'dark';
    if(st.theme==='light') document.documentElement.setAttribute('data-theme','light');
    else document.documentElement.removeAttribute('data-theme');
    render();
  });

  if(window.DTSSchnitt) DTSSchnitt.bind(stageBody);  /* delegiert, übersteht re-render */
  render();
})();
</script>
</body>
</html>
